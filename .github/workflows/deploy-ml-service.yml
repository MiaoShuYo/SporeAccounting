name: Deploy ML Service to Production

on:
  push:
    branches: [main]
    paths:
      - api/SP.MLService/**
      - api/SP.Common/**
      - api/NuGet.Config
      - .github/workflows/deploy-ml-service.yml
      - .github/workflows/deploy-service.yml
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy-service.yml
    with:
      display_name: ML Service
      service_directory: SP.MLService
      image_name: sp-mlservice
      container_name: sp-mlservice
      port: 8975
    secrets: inherit
