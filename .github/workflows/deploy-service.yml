name: Reusable Production Deployment

on:
  workflow_call:
    inputs:
      display_name:
        description: Human-readable service name
        required: true
        type: string
      service_directory:
        description: Service directory below api
        required: true
        type: string
      image_name:
        description: Harbor image repository name
        required: true
        type: string
      container_name:
        description: Production container name
        required: true
        type: string
      port:
        description: Production host port
        required: true
        type: number
    secrets:
      HARBOR_PROJECT:
        required: true
      HARBOR_USERNAME:
        required: true
      HARBOR_PASSWORD:
        required: true
      SERVER_HOST:
        required: true
      SERVER_USERNAME:
        required: true
      SERVER_SSH_KEY:
        required: true

permissions:
  contents: read

env:
  HARBOR_REGISTRY: dockerhub.miaoshuhub.com

jobs:
  deploy:
    name: Deploy ${{ inputs.display_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    concurrency:
      group: production-${{ inputs.container_name }}
      cancel-in-progress: false

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ${{ format('./api/{0}/Dockerfile', inputs.service_directory) }}
          push: true
          cache-from: type=gha,scope=${{ inputs.image_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image_name }}
          tags: |
            ${{ env.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}/${{ inputs.image_name }}:latest
            ${{ env.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}/${{ inputs.image_name }}:${{ github.sha }}

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.0
        env:
          HARBOR_PROJECT: ${{ secrets.HARBOR_PROJECT }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: HARBOR_PROJECT,HARBOR_USERNAME,HARBOR_PASSWORD
          script: |
            set -eu

            REGISTRY="${{ env.HARBOR_REGISTRY }}"
            IMAGE_REF="${{ env.HARBOR_REGISTRY }}/${HARBOR_PROJECT}/${{ inputs.image_name }}:${{ github.sha }}"
            CONTAINER_NAME="${{ inputs.container_name }}"
            PORT="${{ inputs.port }}"

            HOST_IP=$(curl -fsS https://api.ipify.org || curl -fsS https://ifconfig.me || curl -fsS https://ipinfo.io/ip || true)
            if [ -z "$HOST_IP" ]; then HOST_IP=$(ip -o route get 1.1.1.1 2>/dev/null | awk '{print $7; exit}' || true); fi
            if [ -z "$HOST_IP" ]; then HOST_IP=$(hostname -I | awk '{print $1}' || true); fi

            echo "$HARBOR_PASSWORD" | docker login "$REGISTRY" \
              --username "$HARBOR_USERNAME" \
              --password-stdin
            docker pull "$IMAGE_REF"
            docker stop "$CONTAINER_NAME" 2>/dev/null || true
            docker rm "$CONTAINER_NAME" 2>/dev/null || true
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p "${PORT}:80" \
              -e ASPNETCORE_ENVIRONMENT=Production \
              -e HOST_IP="$HOST_IP" \
              -e EXPOSE_PORT="$PORT" \
              "$IMAGE_REF"

            sleep 5
            test "$(docker inspect -f '{{.State.Running}}' "$CONTAINER_NAME")" = "true"
