name: Reusable Production Deployment

on:
  workflow_call:
    inputs:
      display_name:
        description: Human-readable service name
        required: true
        type: string
      service_directory:
        description: Service directory below api
        required: true
        type: string
      image_name:
        description: Docker Hub image name
        required: true
        type: string
      container_name:
        description: Production container name
        required: true
        type: string
      port:
        description: Production host port
        required: true
        type: number
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
      SERVER_HOST:
        required: true
      SERVER_USERNAME:
        required: true
      SERVER_SSH_KEY:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.display_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: production-${{ inputs.container_name }}
      cancel-in-progress: false

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ${{ format('./api/{0}/Dockerfile', inputs.service_directory) }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:${{ github.sha }}

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu

            IMAGE_REF="${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:${{ github.sha }}"
            CONTAINER_NAME="${{ inputs.container_name }}"
            PORT="${{ inputs.port }}"

            HOST_IP=$(curl -fsS https://api.ipify.org || curl -fsS https://ifconfig.me || curl -fsS https://ipinfo.io/ip || true)
            if [ -z "$HOST_IP" ]; then HOST_IP=$(ip -o route get 1.1.1.1 2>/dev/null | awk '{print $7; exit}' || true); fi
            if [ -z "$HOST_IP" ]; then HOST_IP=$(hostname -I | awk '{print $1}' || true); fi

            docker pull "$IMAGE_REF"
            docker stop "$CONTAINER_NAME" 2>/dev/null || true
            docker rm "$CONTAINER_NAME" 2>/dev/null || true
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p "${PORT}:80" \
              -e ASPNETCORE_ENVIRONMENT=Production \
              -e HOST_IP="$HOST_IP" \
              -e EXPOSE_PORT="$PORT" \
              "$IMAGE_REF"

            sleep 5
            test "$(docker inspect -f '{{.State.Running}}' "$CONTAINER_NAME")" = "true"
