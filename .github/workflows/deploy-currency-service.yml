name: Deploy Currency Service to Production

on:
  push:
    branches: [main]
    paths:
      - api/SP.CurrencyService/**
      - api/SP.Common/**
      - api/NuGet.Config
      - .github/workflows/deploy-currency-service.yml
      - .github/workflows/deploy-service.yml
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy-service.yml
    with:
      display_name: Currency Service
      service_directory: SP.CurrencyService
      image_name: sp-currency-service
      container_name: sp-currency-service
      port: 8398
    secrets: inherit
