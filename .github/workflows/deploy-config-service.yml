name: Deploy Config Service to Production

on:
  push:
    branches: [main]
    paths:
      - api/SP.ConfigService/**
      - api/SP.Common/**
      - api/NuGet.Config
      - .github/workflows/deploy-config-service.yml
      - .github/workflows/deploy-service.yml
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy-service.yml
    with:
      display_name: Config Service
      service_directory: SP.ConfigService
      image_name: sp-config-service
      container_name: sp-config-service
      port: 5101
    secrets: inherit
