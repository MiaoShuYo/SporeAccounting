name: Deploy Identity Service to Production

on:
  push:
    branches: [main]
    paths:
      - api/SP.IdentityService/**
      - api/SP.Common/**
      - api/NuGet.Config
      - .github/workflows/deploy-identity-service.yml
      - .github/workflows/deploy-service.yml
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy-service.yml
    with:
      display_name: Identity Service
      service_directory: SP.IdentityService
      image_name: sp-identity-service
      container_name: sp-identity-service
      port: 8397
    secrets: inherit
