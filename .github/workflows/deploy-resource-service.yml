name: Deploy Resource Service to Production

on:
  push:
    branches: [main]
    paths:
      - api/SP.ResourceService/**
      - api/SP.Common/**
      - api/NuGet.Config
      - .github/workflows/deploy-resource-service.yml
      - .github/workflows/deploy-service.yml
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy-service.yml
    with:
      display_name: Resource Service
      service_directory: SP.ResourceService
      image_name: sp-resource-service
      container_name: sp-resource-service
      port: 8973
    secrets: inherit
