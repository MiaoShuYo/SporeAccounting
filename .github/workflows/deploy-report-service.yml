name: Deploy Report Service to Production

on:
  push:
    branches: [main]
    paths:
      - api/SP.ReportService/**
      - api/SP.Common/**
      - api/NuGet.Config
      - .github/workflows/deploy-report-service.yml
      - .github/workflows/deploy-service.yml
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy-service.yml
    with:
      display_name: Report Service
      service_directory: SP.ReportService
      image_name: sp-report-service
      container_name: sp-report-service
      port: 8400
    secrets: inherit
